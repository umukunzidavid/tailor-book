name: tailor_book
description: Offline-first client and order book for tailors, with deadline reminders and backup to the tailor's own Google account.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local database + files (works fully offline)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2

  # Reminders
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # Backup to the user's own Google Drive (hidden app folder)
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  archive: ^3.6.1
  connectivity_plus: ^6.0.5

  # Misc
  intl: ">=0.19.0 <1.0.0"
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# App icon (a sewing needle and thread). Generate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#7A3E2B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
